services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm-chatbot-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/chatbot.db}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.1-flash-lite}
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-false}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-You are a helpful, concise, and accurate AI assistant.}
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: llm-chatbot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
